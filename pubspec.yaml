name: neom_eeg
description: Vendor-agnostic EEG hub (Emotiv via Cortex desktop/mobile, Muse BLE, pending OpenBCI/BrainBit/NeuroSky), signal processing and closed-loop neurofeedback for the Open Neom ecosystem.
version: 0.4.0
homepage: https://www.openneom.dev
repository: https://github.com/Open-Neom/neom_eeg
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  neom_core:
    git:
      url: git@github.com:Open-Neom/neom_core.git
  neom_commons:
    git:
      url: git@github.com:Open-Neom/neom_commons.git

  neom_biofeedback: ^1.0.0

  sint:
    git:
      url: git@github.com:Open-Neom/sint.git

  flutter_blue_plus: ^2.3.15

  web_socket_channel: ^3.0.3

  hive_ce: ^2.23.3
  fl_chart: ^1.3.1



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0



flutter:
